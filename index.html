<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { background: #0b0c10; font-family: ui-sans-serif, system-ui, sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    .fade-in { animation: fadeIn 0.35s ease both; }
    textarea, input { outline: none; }
    button { outline: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0e0f13; }
    ::-webkit-scrollbar-thumb { background: #262934; border-radius: 4px; }

    /* ── GALLERY ── */
    .gallery-wrap {
      position: fixed; inset: 0; background: #07080d;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .gallery-header {
      flex-shrink: 0; padding: 32px 40px 0;
      background: linear-gradient(180deg, #07080d 80%, transparent);
    }
    .gallery-title {
      font-size: 11px; letter-spacing: .18em; color: #22d3ee;
      font-family: monospace; font-weight: 700; text-transform: uppercase; margin-bottom: 6px;
    }
    .gallery-sub {
      font-size: 26px; font-weight: 700; color: #e2e8f0; line-height: 1.2; margin-bottom: 20px;
    }
    .gallery-sub span { color: #22d3ee; }
    .gallery-tabs {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .tab-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 11px; font-family: monospace;
      border: 1px solid #1e2130; cursor: pointer; transition: all .15s;
      background: transparent; color: #64748b;
    }
    .tab-btn.active {
      background: #22d3ee18; border-color: #22d3ee55; color: #22d3ee;
    }
    .gallery-grid-wrap {
      flex: 1; overflow-y: auto; padding: 20px 40px 40px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }
    .char-card {
      border-radius: 12px; border: 1px solid #1e2130; background: #11131a;
      padding: 18px 16px 14px; cursor: pointer;
      transition: border-color .18s, transform .18s, box-shadow .18s;
      display: flex; flex-direction: column; gap: 8px;
      position: relative; overflow: hidden;
    }
    .char-card:hover { border-color: #22d3ee55; transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.6); }
    .char-card.selected { border-color: #22d3ee; box-shadow: 0 0 0 1px #22d3ee, 0 8px 32px rgba(34,211,238,.15); }
    .char-card-glow {
      position: absolute; inset: 0; opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    .char-card:hover .char-card-glow, .char-card.selected .char-card-glow { opacity: 1; }
    .char-avatar {
      font-size: 32px; line-height: 1; margin-bottom: 2px;
    }
    .char-name {
      font-size: 13px; font-weight: 700; color: #e2e8f0; font-family: monospace;
    }
    .char-tag {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 9px; font-family: monospace; font-weight: 700; letter-spacing: .06em;
      width: fit-content;
    }
    .char-desc {
      font-size: 10px; color: #475569; line-height: 1.55; margin-top: 2px;
    }
    .gallery-footer {
      flex-shrink: 0; padding: 16px 40px 24px;
      background: linear-gradient(0deg, #07080d 70%, transparent);
      display: flex; align-items: center; justify-content: space-between;
    }
    .enter-btn {
      padding: 12px 32px; border-radius: 8px; font-size: 13px; font-weight: 700;
      font-family: monospace; border: none; cursor: pointer;
      background: #22d3ee; color: #07080d;
      transition: opacity .15s, transform .15s;
    }
    .enter-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .enter-btn:not(:disabled):hover { transform: translateY(-1px); }
    .persona-badge {
      display: flex; align-items: center; gap: 8px;
      background: #11131a; border: 1px solid #1e2130;
      border-radius: 8px; padding: 6px 12px; cursor: pointer;
      font-family: monospace; font-size: 11px; color: #94a3b8;
      transition: border-color .15s;
    }
    .persona-badge:hover { border-color: #22d3ee55; }
  </style>
</head>

    // ── API CALLS ─────────────────────────────────────────────────────────────
    async function callClaude(systemPrompt, prompt, useSearch) {
      const body = {
        model: "claude-sonnet-4-6", max_tokens: 1000,
        system: systemPrompt || undefined,
        messages: [{ role: "user", content: prompt }],
      };
      if (useSearch) body.tools = [{ type: "web_search_20250305", name: "web_search" }];
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error("Claude API: " + res.status);
      const data = await res.json();
      return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    }
    async function callOpenAIImage(prompt, apiKey) {
      if (!apiKey) throw new Error("Falta API key de OpenAI");
      const res = await fetch("https://api.openai.com/v1/images/generations", {
        method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
        body: JSON.stringify({model:"dall-e-3",prompt,n:1,size:"1024x1024",response_format:"b64_json"}),
      });
      if (!res.ok) throw new Error("OpenAI: "+res.status);
      const data = await res.json();
      return "data:image/png;base64,"+data.data[0].b64_json;
    }
    async function callStabilityImage(prompt, apiKey) {
      if (!apiKey) throw new Error("Falta API key de Stability");
      const form = new FormData();
      form.append("prompt",prompt); form.append("output_format","png");
      const res = await fetch("https://api.stability.ai/v2beta/stable-image/generate/core", {
        method:"POST", headers:{Authorization:"Bearer "+apiKey, Accept:"image/*"}, body:form,
      });
      if (!res.ok) throw new Error("Stability: "+res.status);
      return URL.createObjectURL(await res.blob());
    }
    async function callReplicate(apiKey, version, input) {
      if (!apiKey) throw new Error("Falta API key de Replicate");
      if (!version) throw new Error("Falta versión del modelo Replicate");
      const create = await fetch("https://api.replicate.com/v1/predictions", {
        method:"POST", headers:{"Content-Type":"application/json","Authorization":"Token "+apiKey},
        body: JSON.stringify({version, input}),
      });
      if (!create.ok) throw new Error("Replicate: "+create.status);
      let pred = await create.json();
      while (pred.status==="starting"||pred.status==="processing") {
        await new Promise(r=>setTimeout(r,2500));
        const poll = await fetch("https://api.replicate.com/v1/predictions/"+pred.id, {headers:{Authorization:"Token "+apiKey}});
        pred = await poll.json();
      }
      if (pred.status!=="succeeded") throw new Error("Replicate: "+pred.status);
      return pred.output;
    }
    async function callElevenLabs(text, apiKey, voiceId) {
      if (!apiKey) throw new Error("Falta API key de ElevenLabs");
      const vid = voiceId||"21m00Tcm4TlvDq8ikWAM";
      const res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+vid, {
        method:"POST", headers:{"Content-Type":"application/json","xi-api-key":apiKey,Accept:"audio/mpeg"},
        body: JSON.stringify({text, model_id:"eleven_multilingual_v2"}),
      });
      if (!res.ok) throw new Error("ElevenLabs: "+res.status);
      return URL.createObjectURL(await res.blob());
    }
    async function callMeshy(prompt, apiKey) {
      if (!apiKey) throw new Error("Falta API key de Meshy");
      const create = await fetch("https://api.meshy.ai/openapi/v2/text-to-3d", {
        method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
        body: JSON.stringify({mode:"preview",prompt,art_style:"realistic"}),
      });
      if (!create.ok) throw new Error("Meshy: "+create.status);
      const {result:taskId} = await create.json();
      let task;
      while(true) {
        await new Promise(r=>setTimeout(r,3000));
        const poll = await fetch("https://api.meshy.ai/openapi/v2/text-to-3d/"+taskId, {headers:{Authorization:"Bearer "+apiKey}});
        task = await poll.json();
        if (task.status==="SUCCEEDED"||task.status==="FAILED") break;
      }
      if (task.status!=="SUCCEEDED") throw new Error("Meshy falló");
      return {thumbnail:task.thumbnail_url, modelUrl:task.model_urls?.glb};
    }
    async function callDeepSeek(systemPrompt, prompt, apiKey) {
      if (!apiKey) throw new Error("Falta API key de DeepSeek");
      const messages = [];
      if (systemPrompt) messages.push({role:"system", content:systemPrompt});
      messages.push({role:"user", content:prompt});
      const res = await fetch("https://api.deepseek.com/chat/completions", {
        method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
        body: JSON.stringify({model:"deepseek-chat", messages}),
      });
      if (!res.ok) throw new Error("DeepSeek: "+res.status);
      const data = await res.json();
      return data.choices[0].message.content;
    }
    async function callAyrshare(content, apiKey, platforms, mediaUrl) {
      if (!apiKey) throw new Error("Falta API key de Ayrshare");
      const body = {post:content, platforms};
      if (mediaUrl) body.mediaUrls = [mediaUrl];
      const res = await fetch("https://app.ayrshare.com/api/post", {
        method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error("Ayrshare: "+res.status);
      return res.json();
    }
    // Microsoft Graph (Outlook). Requiere un access token OAuth obtenido por el usuario
    // (MSAL / login con su cuenta Microsoft). No se puede generar este token automáticamente:
    // cada usuario debe autorizar la app con su propia cuenta.
    async function callOutlookSend(accessToken, to, subject, bodyText) {
      if (!accessToken) throw new Error("Falta Access Token de Microsoft Graph (inicia sesión con tu cuenta Outlook)");
      if (!to) throw new Error("Falta destinatario");
      const res = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},
        body: JSON.stringify({
          message: {
            subject: subject||"(sin asunto)",
            body: { contentType:"Text", content: bodyText||"" },
            toRecipients: [{ emailAddress:{ address: to } }],
          },
        }),
      });
      if (!res.ok) throw new Error("Outlook/Graph: "+res.status);
      return { sent:true, to, subject };
    }
    async function callOutlookListInbox(accessToken, top) {
      if (!accessToken) throw new Error("Falta Access Token de Microsoft Graph");
      const res = await fetch(`https://graph.microsoft.com/v1.0/me/messages?$top=${top||5}&$select=subject,from,receivedDateTime,bodyPreview`, {
        headers:{Authorization:"Bearer "+accessToken},
      });
      if (!res.ok) throw new Error("Outlook/Graph: "+res.status);
      const data = await res.json();
      return (data.value||[]).map(m=>`• [${m.from?.emailAddress?.address||"?"}] ${m.subject}\n  ${m.bodyPreview}`).join("\n\n");
    }
    // Meta (WhatsApp Business API / Messenger). Requiere Phone Number ID (WhatsApp) o Page ID
    // (Messenger), y un token permanente generado en Meta for Developers. El usuario debe
    // crear su propia cuenta y app — no se puede automatizar ese registro.
    async function callMetaMessage(channel, accessToken, fromId, to, text) {
      if (!accessToken) throw new Error("Falta Access Token de Meta");
      if (!fromId) throw new Error("Falta el Phone Number ID (WhatsApp) o Page ID (Messenger)");
      if (!to) throw new Error("Falta destinatario (número o PSID)");
      if (channel==="whatsapp") {
        const res = await fetch(`https://graph.facebook.com/v20.0/${fromId}/messages`, {
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},
          body: JSON.stringify({ messaging_product:"whatsapp", to, type:"text", text:{ body:text||"" } }),
        });
        if (!res.ok) throw new Error("WhatsApp API: "+res.status);
        return res.json();
      } else {
        const res = await fetch(`https://graph.facebook.com/v20.0/${fromId}/messages?access_token=${accessToken}`, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ recipient:{ id: to }, message:{ text: text||"" } }),
        });
        if (!res.ok) throw new Error("Messenger API: "+res.status);
        return res.json();
      }
    }

    // ── BLUEPRINT STUDIO CANVAS ───────────────────────────────────────────────
    function BlueprintStudio({ persona, onChangePersona }) {
      const [nodes, setNodes]           = useState([]);
      const [connections, setConnections] = useState([]);
      const [apiKeys, setApiKeys]       = useState({
        openai:"", stability:"", replicate:"", elevenlabs:"",
        elevenVoice:"", meshy:"", ayrshare:"", deepseek:"",
        outlookToken:"", metaToken:"", metaPhoneId:"", metaPageId:"",
      });
      const [showSettings, setShowSettings] = useState(false);
      const [loaded, setLoaded]         = useState(false);
      const [pan, setPan]               = useState({ x:80, y:60 });
      const [wireEnd, setWireEnd]       = useState(null);

      const dragRef  = useRef(null);
      const wrapRef  = useRef(null);
      const nodesRef = useRef(nodes);
      const connsRef = useRef(connections);
      nodesRef.current = nodes;
      connsRef.current = connections;

      useEffect(() => {
        try { const k=localStorage.getItem("bp_apiKeys"); if(k) setApiKeys(p=>({...p,...JSON.parse(k)})); } catch{}
        try {
          const g=localStorage.getItem("bp_graph");
          if(g){const p=JSON.parse(g); setNodes(p.nodes||[]); setConnections(p.connections||[]);}
        } catch{}
        setLoaded(true);
      }, []);

      useEffect(() => {
        if(!loaded) return;
        const t=setTimeout(()=>localStorage.setItem("bp_graph", JSON.stringify({nodes,connections})),600);
        return ()=>clearTimeout(t);
      }, [nodes, connections, loaded]);

      function saveKeys(k){ setApiKeys(k); try{localStorage.setItem("bp_apiKeys",JSON.stringify(k));}catch{} }

      function addNode(type) {
        const idx=nodesRef.current.length;
        setNodes(ns=>[...ns,{
          id:uid(), type,
          x:80+(idx%4)*40, y:60+(idx%6)*50,
          prompt:"", config:{...DEFAULT_CONFIG[type]},
          status:"idle", output:null, error:null,
        }]);
      }
      function updateNode(id,patch){ setNodes(ns=>ns.map(n=>n.id===id?{...n,...patch}:n)); }
      function updateConfig(id,patch){ setNodes(ns=>ns.map(n=>n.id===id?{...n,config:{...n.config,...patch}}:n)); }
      function removeNode(id){ setNodes(ns=>ns.filter(n=>n.id!==id)); setConnections(cs=>cs.filter(c=>c.from!==id&&c.to!==id)); }
      function removeConn(id){ setConnections(cs=>cs.filter(c=>c.id!==id)); }
      function clearAll(){ if(window.confirm("¿Borrar todo el flujo?")){setNodes([]);setConnections([]);} }

      // system prompt from persona
      const sysPrompt = persona?.systemPrompt || null;

      async function runNode(id) {
        const node = nodesRef.current.find(n=>n.id===id);
        if(!node) return;
        updateNode(id,{status:"running",error:null});
        const upstream = connsRef.current.filter(c=>c.to===id)
          .map(c=>nodesRef.current.find(n=>n.id===c.from)).filter(Boolean);
        const upText  = upstream.filter(n=>n.output?.type==="text").map(n=>n.output.value).join("\n\n");
        const upImage = upstream.find(n=>n.output?.type==="image")?.output||null;
        const full    = [node.prompt,upText].filter(Boolean).join("\n\n");
        try {
          let output;
          if (node.type==="text") {
            output={type:"text",value:node.prompt||""};
          } else if (node.type==="search") {
            output={type:"text",value:await callClaude(sysPrompt,full,true)};
          } else if (node.type==="dev") {
            const dp="Tarea de desarrollo: "+full+"\n\nResponde solo con código final, completo y comentado.";
            const txt = node.config.provider==="deepseek"
              ? await callDeepSeek(sysPrompt,dp,apiKeys.deepseek)
              : await callClaude(sysPrompt,dp,false);
            output={type:"text",value:txt};
          } else if (node.type==="image") {
            let url;
            if (node.config.provider==="openai") url=await callOpenAIImage(full,apiKeys.openai);
            else if (node.config.provider==="stability") url=await callStabilityImage(full,apiKeys.stability);
            else { const out=await callReplicate(apiKeys.replicate,node.config.version,{prompt:full}); url=Array.isArray(out)?out[0]:out; }
            output={type:"image",value:url};
          } else if (node.type==="audio") {
            output={type:"audio",value:await callElevenLabs(full,apiKeys.elevenlabs,apiKeys.elevenVoice)};
          } else if (node.type==="video") {
            const out=await callReplicate(apiKeys.replicate,node.config.version,{prompt:full,image:upImage?.value});
            output={type:"video",value:Array.isArray(out)?out[0]:out};
          } else if (node.type==="threeD") {
            const r=await callMeshy(full,apiKeys.meshy);
            output={type:"3d",value:r.modelUrl,thumbnail:r.thumbnail};
          } else if (node.type==="social") {
            const mediaOk=upImage&&/^https?:\/\//.test(upImage.value);
            await callAyrshare(full||node.prompt,apiKeys.ayrshare,node.config.platforms,mediaOk?upImage.value:null);
            output={type:"text",value:"Publicado ✓"};
          } else if (node.type==="outlook") {
            if (node.config.action==="read") {
              output={type:"text",value:await callOutlookListInbox(apiKeys.outlookToken,5)};
            } else {
              await callOutlookSend(apiKeys.outlookToken,node.config.to,node.config.subject,full||node.prompt);
              output={type:"text",value:`Correo enviado a ${node.config.to} ✓`};
            }
          } else if (node.type==="whatsapp") {
            const fromId = node.config.channel==="whatsapp" ? apiKeys.metaPhoneId : apiKeys.metaPageId;
            await callMetaMessage(node.config.channel,apiKeys.metaToken,fromId,node.config.to,full||node.prompt);
            output={type:"text",value:`Mensaje enviado por ${node.config.channel==="whatsapp"?"WhatsApp":"Messenger"} ✓`};
          } else if (node.type==="preview") {
            output={type:"preview",value:upstream.map(n=>({type:n.output?.type,nodeType:n.type,value:n.output?.value}))};
          }
          updateNode(id,{status:"done",output});
        } catch(e){ updateNode(id,{status:"error",error:e?.message||String(e)}); }
      }

      async function runAll() {
        const ids=nodesRef.current.map(n=>n.id);
        const visited=new Set(), order=[];
        function visit(nid){ if(visited.has(nid))return; visited.add(nid); connsRef.current.filter(c=>c.to===nid).forEach(c=>visit(c.from)); order.push(nid); }
        ids.forEach(visit);
        for (const nid of order) await runNode(nid);
      }

      function clientToWorld(cx,cy){ const r=wrapRef.current.getBoundingClientRect(); return{x:cx-r.left-pan.x,y:cy-r.top-pan.y}; }
      function portPos(node,side){ return{x:node.x+(side==="out"?NODE_W:0), y:node.y+PORT_Y}; }
      function bezier(a,b){ const dx=Math.max(50,Math.abs(b.x-a.x)*.5); return`M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`; }

      function onWrapPointerDown(e) {
        const portEl=e.target.closest("[data-port]");
        const nodeEl=e.target.closest("[data-nodeid]");
        if(portEl){
          const side=portEl.dataset.port, nodeId=portEl.dataset.nodeid;
          if(side==="out"){ dragRef.current={mode:"wire",from:nodeId}; setWireEnd(clientToWorld(e.clientX,e.clientY)); }
          return;
        }
        if(nodeEl&&!e.target.closest("[data-nondrag]")){
          const nodeId=nodeEl.dataset.nodeid;
          const node=nodesRef.current.find(n=>n.id===nodeId);
          if(!node) return;
          const wp=clientToWorld(e.clientX,e.clientY);
          dragRef.current={mode:"node",id:nodeId,ox:wp.x-node.x,oy:wp.y-node.y};
          return;
        }
        dragRef.current={mode:"pan",sx:e.clientX-pan.x,sy:e.clientY-pan.y};
      }
      function onWrapPointerMove(e){
        const d=dragRef.current; if(!d) return;
        if(d.mode==="pan") setPan({x:e.clientX-d.sx,y:e.clientY-d.sy});
        else if(d.mode==="node"){ const wp=clientToWorld(e.clientX,e.clientY); updateNode(d.id,{x:wp.x-d.ox,y:wp.y-d.oy}); }
        else if(d.mode==="wire"){ setWireEnd(clientToWorld(e.clientX,e.clientY)); }
      }
      function onWrapPointerUp(e){
        const d=dragRef.current; if(!d) return;
        if(d.mode==="wire"){
          const portEl=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-port='in']");
          if(portEl){ const toId=portEl.dataset.nodeid; if(toId&&toId!==d.from){ setConnections(cs=>{ if(cs.some(c=>c.from===d.from&&c.to===toId))return cs; return[...cs,{id:uid("c"),from:d.from,to:toId}]; }); } }
          setWireEnd(null);
        }
        dragRef.current=null;
      }

      const pill=(active,accent)=>({
        padding:"3px 10px", borderRadius:4, fontSize:10, fontFamily:"monospace",
        cursor:"pointer", border:"none",
        background:active?accent:"#1c1f27", color:active?"#0d0e12":"#94a3b8",
      });
      const KEY_FIELDS=[
        {key:"openai",     label:"OpenAI (DALL·E)"},
        {key:"stability",  label:"Stability AI"},
        {key:"replicate",  label:"Replicate"},
        {key:"elevenlabs", label:"ElevenLabs (audio)"},
        {key:"elevenVoice",label:"ElevenLabs · Voice ID"},
        {key:"meshy",      label:"Meshy (3D)"},
        {key:"ayrshare",   label:"Ayrshare (social)"},
        {key:"deepseek",   label:"DeepSeek (código)"},
        {key:"outlookToken", label:"Outlook · Access Token (Microsoft Graph)"},
        {key:"metaToken",    label:"Meta · Access Token (WhatsApp/Messenger)"},
        {key:"metaPhoneId",  label:"WhatsApp · Phone Number ID"},
        {key:"metaPageId",   label:"Messenger · Page ID"},
      ];

      return (
        <div style={{height:"100vh",width:"100%",display:"flex",flexDirection:"column",background:"#0b0c10"}}>

          {/* TOP BAR */}
          <div style={{height:52,flexShrink:0,background:"#11131a",borderBottom:"1px solid #1e2130",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <ZapIcon size={17} color="#22d3ee"/>
              <span style={{fontFamily:"monospace",fontSize:13,color:"#e2e8f0",letterSpacing:".08em",fontWeight:700}}>BLUEPRINT STUDIO</span>
            </div>

            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {/* Persona badge */}
              {persona && (
                <button className="persona-badge" onClick={onChangePersona} data-nondrag>
                  <span style={{fontSize:14}}>{persona.emoji}</span>
                  <span style={{color:persona.accentColor,fontWeight:700}}>{persona.name}</span>
                  <span style={{fontSize:9,color:"#475569"}}>▼</span>
                </button>
              )}
              {!persona && (
                <button className="persona-badge" onClick={onChangePersona} data-nondrag>
                  <UserIcon size={12}/> Sin personaje ▼
                </button>
              )}

              <button onClick={runAll}
                style={{display:"flex",alignItems:"center",gap:6,padding:"5px 14px",borderRadius:5,background:"#22d3ee",color:"#0b0c10",fontSize:12,fontWeight:700,fontFamily:"monospace",border:"none",cursor:"pointer"}}>
                <PlayIcon size={12} color="#0b0c10"/> Ejecutar todo
              </button>
              <button onClick={clearAll} style={{padding:7,borderRadius:5,background:"#1c1f27",border:"none",cursor:"pointer",display:"flex"}} data-nondrag>
                <TrashIcon size={15} color="#64748b"/>
              </button>
              <button onClick={()=>setShowSettings(true)} style={{padding:7,borderRadius:5,background:"#1c1f27",border:"none",cursor:"pointer",display:"flex"}} data-nondrag>
                <GearIcon size={15} color="#64748b"/>
              </button>
            </div>
          </div>

          {/* CANVAS */}
          <div ref={wrapRef}
            style={{
              flex:1, position:"relative", overflow:"hidden",
              backgroundColor:"#0b0c10",
              backgroundImage:"radial-gradient(#192028 1px, transparent 1px)",
              backgroundSize:"22px 22px",
              backgroundPosition:`${pan.x%22}px ${pan.y%22}px`,
            }}
            onPointerDown={onWrapPointerDown}
            onPointerMove={onWrapPointerMove}
            onPointerUp={onWrapPointerUp}
            onPointerLeave={onWrapPointerUp}
          >
            {/* PALETTE */}
            <div data-nondrag style={{position:"absolute",left:12,top:12,zIndex:30,background:"rgba(15,17,24,0.96)",border:"1px solid #1e2130",borderRadius:10,padding:"6px 4px",backdropFilter:"blur(10px)",display:"flex",flexDirection:"column",gap:1}}>
              {persona && (
                <div style={{padding:"6px 12px 8px",borderBottom:"1px solid #1e2130",marginBottom:4}}>
                  <div style={{fontSize:9,color:"#475569",fontFamily:"monospace",marginBottom:4,letterSpacing:".05em"}}>PERSONAJE ACTIVO</div>
                  <div style={{display:"flex",alignItems:"center",gap:6,fontFamily:"monospace",fontSize:11,fontWeight:700,color:persona.accentColor}}>
                    <span style={{fontSize:16}}>{persona.emoji}</span> {persona.name}
                  </div>
                  <span style={{fontSize:9,color:persona.tagColor,background:persona.tagBg,padding:"1px 6px",borderRadius:8,fontFamily:"monospace"}}>{persona.tag}</span>
                </div>
              )}
              {Object.keys(NODE_TYPES).map(type=>{
                const def=NODE_TYPES[type];
                return(
                  <button key={type} onClick={()=>addNode(type)}
                    data-nondrag
                    style={{display:"flex",alignItems:"center",gap:8,padding:"7px 12px",borderRadius:6,background:"transparent",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:12,fontFamily:"monospace",whiteSpace:"nowrap"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#1c1f27"}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <def.Icon size={13} color={def.color}/> {def.label}
                  </button>
                );
              })}
            </div>

            {/* WORLD */}
            <div style={{position:"absolute",left:0,top:0,transform:`translate(${pan.x}px,${pan.y}px)`,width:8000,height:8000,pointerEvents:"none"}}>
              <svg width={8000} height={8000} style={{position:"absolute",inset:0,overflow:"visible"}}>
                <defs>
                  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>
                {connections.map(c=>{
                  const a=nodes.find(n=>n.id===c.from), b=nodes.find(n=>n.id===c.to);
                  if(!a||!b) return null;
                  const ac=persona?persona.accentColor:"#22d3ee";
                  return(
                    <g key={c.id}>
                      <path d={bezier(portPos(a,"out"),portPos(b,"in"))} stroke="transparent" strokeWidth={14} fill="none" style={{cursor:"pointer",pointerEvents:"stroke"}} onClick={()=>removeConn(c.id)}/>
                      <path d={bezier(portPos(a,"out"),portPos(b,"in"))} stroke={ac} strokeWidth={1.8} fill="none" filter="url(#glow)" style={{pointerEvents:"none"}}/>
                    </g>
                  );
                })}
                {dragRef.current?.mode==="wire"&&wireEnd&&(()=>{
                  const a=nodes.find(n=>n.id===dragRef.current.from); if(!a) return null;
                  const ac=persona?persona.accentColor:"#22d3ee";
                  return<path d={bezier(portPos(a,"out"),wireEnd)} stroke={ac} strokeWidth={1.8} strokeDasharray="5 4" fill="none" opacity={.55}/>;
                })()}
              </svg>

              {nodes.map(node=>{
                const def=NODE_TYPES[node.type];
                const portColor = persona ? persona.accentColor : def.color;
                return(
                  <div key={node.id} data-nodeid={node.id}
                    style={{
                      position:"absolute",left:node.x,top:node.y,width:NODE_W,
                      background:"#13151b",
                      border:`1px solid ${node.status==="error"?"#ef444455":"#1e2130"}`,
                      borderRadius:9, boxShadow:"0 6px 24px rgba(0,0,0,.55)",
                      pointerEvents:"all",
                    }}>

                    {/* IN port */}
                    <div data-port="in" data-nodeid={node.id}
                      style={{position:"absolute",left:-PORT_R-1,top:PORT_Y-PORT_R,width:PORT_R*2,height:PORT_R*2,borderRadius:"50%",background:"#0b0c10",border:`2px solid ${portColor}`,cursor:"crosshair",zIndex:5,pointerEvents:"all"}}/>

                    {/* Header */}
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 11px",background:"#181b23",borderBottom:"1px solid #1e2130",cursor:"grab",userSelect:"none",borderRadius:"9px 9px 0 0"}}>
                      <div style={{display:"flex",alignItems:"center",gap:7,fontFamily:"monospace",fontSize:11,color:"#dde4f0",fontWeight:600}}>
                        <def.Icon size={12} color={def.color}/> {def.label}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        {node.status==="running"&&<Loader size={13}/>}
                        {node.status==="done"&&<OkIcon size={13} color="#34d399"/>}
                        {node.status==="error"&&<ErrIcon size={13} color="#ef4444"/>}
                        <button data-nondrag onClick={()=>removeNode(node.id)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",padding:0,pointerEvents:"all"}}>
                          <XIcon size={12} color="#475569"/>
                        </button>
                      </div>
                    </div>

                    {/* Persona context hint */}
                    {persona && (
                      <div data-nondrag style={{padding:"4px 10px",background:`${persona.accentColor}0a`,borderBottom:"1px solid #1e2130",fontSize:9,fontFamily:"monospace",color:persona.accentColor,display:"flex",alignItems:"center",gap:4}}>
                        {persona.emoji} Contexto: <strong>{persona.name}</strong>
                      </div>
                    )}

                    {/* Body */}
                    <div data-nondrag style={{padding:10,display:"flex",flexDirection:"column",gap:7}}>
                      {node.type==="dev"&&(
                        <div style={{display:"flex",gap:4}}>
                          {["claude","deepseek"].map(p=>(
                            <button key={p} onClick={()=>updateConfig(node.id,{provider:p})} style={pill(node.config.provider===p,"#22d3ee")}>{p}</button>
                          ))}
                        </div>
                      )}
                      {node.type==="image"&&(
                        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                          {["openai","stability","replicate"].map(p=>(
                            <button key={p} onClick={()=>updateConfig(node.id,{provider:p})} style={pill(node.config.provider===p,"#c084fc")}>{p}</button>
                          ))}
                        </div>
                      )}
                      {node.type==="image"&&node.config.provider==="replicate"&&(
                        <input value={node.config.version||""} onChange={e=>updateConfig(node.id,{version:e.target.value})} placeholder="versión del modelo Replicate"
                          style={{width:"100%",padding:"5px 8px",borderRadius:4,fontSize:11,fontFamily:"monospace",background:"#0d0e14",border:"1px solid #1e2130",color:"#e2e8f0"}}/>
                      )}
                      {node.type==="video"&&(
                        <>
                          <div style={{display:"flex",gap:4}}>
                            {["stability","replicate"].map(p=>(
                              <button key={p} onClick={()=>updateConfig(node.id,{provider:p})} style={pill(node.config.provider===p,"#fb7185")}>{p}</button>
                            ))}
                          </div>
                          <input value={node.config.version||""} onChange={e=>updateConfig(node.id,{version:e.target.value})} placeholder="versión del modelo"
                            style={{width:"100%",padding:"5px 8px",borderRadius:4,fontSize:11,fontFamily:"monospace",background:"#0d0e14",border:"1px solid #1e2130",color:"#e2e8f0"}}/>
                        </>
                      )}
                      {node.type==="social"&&(
                        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                          {PLATFORMS.map(p=>{
                            const active=node.config.platforms?.includes(p);
                            return<button key={p} onClick={()=>{const cur=node.config.platforms||[]; updateConfig(node.id,{platforms:active?cur.filter(x=>x!==p):[...cur,p]});}} style={{...pill(active,"#f472b6"),textTransform:"capitalize"}}>{p}</button>;
                          })}
                        </div>
                      )}
                      {node.type==="outlook"&&(
                        <>
                          <div style={{display:"flex",gap:4}}>
                            {[{v:"send",l:"Enviar"},{v:"read",l:"Leer bandeja"}].map(o=>(
                              <button key={o.v} onClick={()=>updateConfig(node.id,{action:o.v})} style={pill(node.config.action===o.v,"#0ea5e9")}>{o.l}</button>
                            ))}
                          </div>
                          {node.config.action==="send"&&(
                            <>
                              <input value={node.config.to||""} onChange={e=>updateConfig(node.id,{to:e.target.value})} placeholder="destinatario@correo.com"
                                style={{width:"100%",padding:"5px 8px",borderRadius:4,fontSize:11,fontFamily:"monospace",background:"#0d0e14",border:"1px solid #1e2130",color:"#e2e8f0"}}/>
                              <input value={node.config.subject||""} onChange={e=>updateConfig(node.id,{subject:e.target.value})} placeholder="asunto del correo"
                                style={{width:"100%",padding:"5px 8px",borderRadius:4,fontSize:11,fontFamily:"monospace",background:"#0d0e14",border:"1px solid #1e2130",color:"#e2e8f0"}}/>
                            </>
                          )}
                        </>
                      )}
                      {node.type==="whatsapp"&&(
                        <>
                          <div style={{display:"flex",gap:4}}>
                            {[{v:"whatsapp",l:"WhatsApp"},{v:"messenger",l:"Messenger"}].map(o=>(
                              <button key={o.v} onClick={()=>updateConfig(node.id,{channel:o.v})} style={pill(node.config.channel===o.v,"#22c55e")}>{o.l}</button>
                            ))}
                          </div>
                          <input value={node.config.to||""} onChange={e=>updateConfig(node.id,{to:e.target.value})}
                            placeholder={node.config.channel==="whatsapp"?"número (ej. 521234567890)":"PSID del destinatario"}
                            style={{width:"100%",padding:"5px 8px",borderRadius:4,fontSize:11,fontFamily:"monospace",background:"#0d0e14",border:"1px solid #1e2130",color:"#e2e8f0"}}/>
                        </>
                      )}

                      <textarea value={node.prompt} onChange={e=>updateNode(node.id,{prompt:e.target.value})}
                        placeholder={node.type==="text"?"Escribe el texto fuente…":node.type==="social"?"Texto del post…":"Describe lo que necesitas…"}
                        rows={2}
                        style={{width:"100%",padding:"6px 8px",borderRadius:4,fontSize:12,fontFamily:"monospace",background:"#0d0e14",border:"1px solid #1e2130",color:"#e2e8f0",resize:"vertical"}}/>

                      <button onClick={()=>runNode(node.id)} disabled={node.status==="running"}
                        style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"6px",borderRadius:5,fontSize:12,fontFamily:"monospace",cursor:node.status==="running"?"not-allowed":"pointer",border:`1px solid ${def.color}35`,background:"#181b23",color:def.color,opacity:node.status==="running"?.6:1}}>
                        <PlayIcon size={11} color={def.color}/> Ejecutar
                      </button>

                      {node.error&&(
                        <div style={{padding:"6px 8px",borderRadius:4,fontSize:10,fontFamily:"monospace",background:"#2a1215",color:"#fca5a5",lineHeight:1.5}}>{node.error}</div>
                      )}
                      {node.output&&(
                        <div style={{borderRadius:5,border:"1px solid #1e2130",overflow:"hidden"}}>
                          {node.output.type==="text"&&<div style={{padding:8,fontSize:10,fontFamily:"monospace",color:"#94a3b8",whiteSpace:"pre-wrap",maxHeight:130,overflowY:"auto",lineHeight:1.6}}>{node.output.value}</div>}
                          {node.output.type==="image"&&<img src={node.output.value} style={{width:"100%",display:"block"}} alt=""/>}
                          {node.output.type==="audio"&&<audio controls src={node.output.value} style={{width:"100%",display:"block"}}/>}
                          {node.output.type==="video"&&<video controls src={node.output.value} style={{width:"100%",display:"block"}}/>}
                          {node.output.type==="3d"&&(
                            <div style={{padding:8,display:"flex",flexDirection:"column",gap:6}}>
                              {node.output.thumbnail&&<img src={node.output.thumbnail} style={{width:"100%",borderRadius:4}} alt=""/>}
                              {node.output.value&&<a href={node.output.value} target="_blank" rel="noreferrer" style={{fontSize:10,color:"#34d399",textDecoration:"none"}}>⬇ Descargar modelo .glb</a>}
                            </div>
                          )}
                          {node.output.type==="preview"&&(
                            <div style={{padding:8,display:"flex",flexDirection:"column",gap:8,maxHeight:220,overflowY:"auto"}}>
                              {node.output.value.length===0&&(
                                <div style={{fontSize:10,fontFamily:"monospace",color:"#475569"}}>Sin nodos conectados todavía.</div>
                              )}
                              {node.output.value.map((item,i)=>(
                                <div key={i} style={{border:"1px solid #1e2130",borderRadius:4,padding:6}}>
                                  <div style={{fontSize:9,fontFamily:"monospace",color:"#fb923c",marginBottom:4,textTransform:"uppercase"}}>{item.nodeType}</div>
                                  {item.type==="text"&&<div style={{fontSize:10,fontFamily:"monospace",color:"#94a3b8",whiteSpace:"pre-wrap",lineHeight:1.5}}>{item.value}</div>}
                                  {item.type==="image"&&<img src={item.value} style={{width:"100%",borderRadius:3}} alt=""/>}
                                  {item.type==="audio"&&<audio controls src={item.value} style={{width:"100%"}}/>}
                                  {item.type==="video"&&<video controls src={item.value} style={{width:"100%",borderRadius:3}}/>}
                                  {!item.type&&<div style={{fontSize:10,color:"#475569"}}>(sin ejecutar aún)</div>}
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    {/* OUT port */}
                    <div data-port="out" data-nodeid={node.id}
                      style={{position:"absolute",right:-PORT_R-1,top:PORT_Y-PORT_R,width:PORT_R*2,height:PORT_R*2,borderRadius:"50%",background:"#0b0c10",border:`2px solid ${portColor}`,cursor:"crosshair",zIndex:5,pointerEvents:"all"}}/>
                  </div>
                );
              })}

              {nodes.length===0&&(
                <div style={{position:"absolute",left:320,top:200,fontFamily:"monospace",fontSize:12,color:"#2a3040",lineHeight:2,pointerEvents:"none",textAlign:"center"}}>
                  ← Agrega un nodo desde el panel izquierdo<br/>
                  Conéctalos arrastrando desde el puerto ● derecho al ● izquierdo
                </div>
              )}
            </div>
          </div>

          {/* SETTINGS */}
          {showSettings&&(
            <div onClick={()=>setShowSettings(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
              <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:420,background:"#13151b",border:"1px solid #1e2130",borderRadius:12,padding:22}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,fontFamily:"monospace",fontSize:13,color:"#e2e8f0",fontWeight:700}}>
                    <KeyIcon size={14} color="#22d3ee"/> API KEYS
                  </div>
                  <button onClick={()=>setShowSettings(false)} style={{background:"none",border:"none",cursor:"pointer",display:"flex"}}><XIcon size={16} color="#64748b"/></button>
                </div>
                <p style={{fontSize:11,color:"#475569",marginBottom:14,lineHeight:1.6}}>
                  Guardadas en localStorage. <strong style={{color:"#94a3b8"}}>Búsqueda</strong> y <strong style={{color:"#94a3b8"}}>Dev (claude)</strong> no requieren key.
                  <br/><strong style={{color:"#0ea5e9"}}>Outlook</strong> y <strong style={{color:"#22c55e"}}>WhatsApp/Messenger</strong> requieren que tú obtengas tu propio token (Microsoft Graph / Meta for Developers) — no se generan aquí.
                </p>
                <div style={{display:"flex",flexDirection:"column",gap:10,maxHeight:"55vh",overflowY:"auto"}}>
                  {KEY_FIELDS.map(f=>(
                    <div key={f.key}>
                      <label style={{display:"block",fontFamily:"monospace",fontSize:10,color:"#64748b",marginBottom:4}}>{f.label}</label>
                      <input type="password" value={apiKeys[f.key]||""} onChange={e=>setApiKeys(k=>({...k,[f.key]:e.target.value}))}
                        style={{width:"100%",padding:"7px 10px",borderRadius:5,fontSize:12,fontFamily:"monospace",background:"#0d0e14",border:"1px solid #1e2130",color:"#e2e8f0"}}/>
                    </div>
                  ))}
                </div>
                <button onClick={()=>{saveKeys(apiKeys);setShowSettings(false);}}
                  style={{width:"100%",marginTop:16,padding:"9px",borderRadius:6,fontSize:12,fontWeight:700,fontFamily:"monospace",background:"#22d3ee",color:"#0b0c10",border:"none",cursor:"pointer"}}>
                  Guardar
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── ROOT ──────────────────────────────────────────────────────────────────
    function App() {
      const [persona, setPersona]         = useState(undefined); // undefined = showing gallery
      const [showGallery, setShowGallery] = useState(true);

      function handleSelect(ch) {
        setPersona(ch);       // ch can be null (sin personaje) or a character object
        setShowGallery(false);
      }
      function handleChangePersona() { setShowGallery(true); }

      if (showGallery) return <CharacterGallery onSelect={handleSelect}/>;
      return <BlueprintStudio persona={persona} onChangePersona={handleChangePersona}/>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
